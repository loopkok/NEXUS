# Quest3 pinch → left gripper. Units: landmark meters, actuator radians.
#
# close_ratio 0 = open, 1 = pinched/closed.
# open_rad / closed_rad = 夹爪电机角度（0x31）。真机方向：0.8=张开, 0.0=合拢，
# 故 close_ratio=1(捏合)→0.0(合)、close_ratio=0(张开)→0.8(开)。
#
# Swap this node later: another publisher on /left_gripper/command is enough
# if astral_robot_control is running.

pinch_gripper_node:
  ros__parameters:
    hand_side: "left"
    open_dist_m: 0.08
    close_dist_m: 0.015
    open_rad: 0.8
    closed_rad: 0.0
    ema_alpha: 0.4
    publish_rate: 50.0
    input_timeout_s: 0.4
    on_timeout: "hold"
    log_interval_s: 2.0
    # 自适应量程：跟踪真实捏合距离的 min/max（带遗忘），用满夹爪行程。
    # open_dist_m/close_dist_m 退化为先验/回退。关掉则用固定 open/close 映射。
    auto_range: true
    auto_range_forget_s: 8.0
    auto_range_min_span_m: 0.01
