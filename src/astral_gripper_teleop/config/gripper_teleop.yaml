# Quest3 pinch → /{side}_gripper/command (Float64: 0=open, 1=closed).
#
# 本节点只发 0..1 闭合比；弧度映射（open_rad/closed_rad，CMD 0x97/0x98）唯一权威
# 在 astral_robot_control 的 config/astral_robot.yaml（left/right_gripper_open_rad
# 当前 1.5，硬止点 2.0）。切勿同时发 joint_commands：driver 两个话题都订，
# 双流不同 rad 会让夹爪按控制频率来回抽。
#
# Swap this node later: another publisher on /left_gripper/command is enough
# if astral_robot_control is running.

pinch_gripper_node:
  ros__parameters:
    hand_side: "left"
    open_dist_m: 0.08
    close_dist_m: 0.015
    ema_alpha: 0.4
    publish_rate: 50.0
    input_timeout_s: 0.4
    on_timeout: "hold"
    log_interval_s: 2.0
    # 自适应量程：跟踪真实捏合距离的 min/max（带遗忘），用满夹爪行程。
    # open_dist_m/close_dist_m 退化为先验/回退。关掉则用固定 open/close 映射。
    auto_range: true
    auto_range_forget_s: 8.0
    auto_range_min_span_m: 0.01
