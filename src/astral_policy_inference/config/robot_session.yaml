# astral_policy_inference — 非 ROS 真机推理 Session 配置
#
# 脱离 ROS2 的机器人侧部署：PolicyRunner（纯线程编排）+ astral_robot_sdk（UDP→控制板）
# + 相机采集。schema 段必须与数采当时的 data_collect.yaml 一致（schema 是布局唯一真源）；
# 其余为本 session 专用。
#
# 用法：
#   python scripts/robot_session_cli.py --config config/robot_session.yaml
# 或编程调用（见 astral_policy_inference/session.py 的 build_robot_session / RobotSession）。
robot_session:
  # ---------------- schema：必须与数采当时一致（真源） ------------------------
  schema:
    arms: ["left"]            # ["left"] | ["left", "right"]
    end_effector_left: "gripper"
    end_effector_right: "none"
    include_waist: false
    include_head: false
    cameras: ["video8", "video0"]
    dataset_fps: 30           # 策略/回放节奏

  # ---------------- robot：控制板 / 夹爪 / 阻尼语义 ----------------------------
  robot:
    board_ip: "192.168.10.2"
    board_cmd_port: 5001
    local_ip: "0.0.0.0"
    local_port: 8081
    obs_hz: 50
    ctrl_hz: 50
    auto_ready: true          # connect 时 one_click_ready（WORK→POSITION→enable→zero）
    lpf_enable: true
    lpf_alpha: 0.85
    # 夹爪 ratio(0..1) → rad 映射（与 astral_robot_control/config/astral_robot.yaml 一致）
    left_gripper_open_rad: 0.8
    left_gripper_closed_rad: 0.0
    right_gripper_open_rad: 0.8
    right_gripper_closed_rad: 0.0
    default_gripper_ratio: 0.0   # 首条夹爪指令前的回显值（真机无反馈）
    stop_mode: "hold"            # stop 后：hold=位置保持 | damping=阻尼（人工拖臂）
    dry_run: false               # true=不连板（默认零位 + 命令打日志），bring-up 用

  # ---------------- cameras：label -> 采集方式 ----------------------------------
  cameras:
    video0: {kind: v4l2, device: 0, width: 640, height: 480, fps: 30}
    # D435i 优先 pyrealsense2（kind: realsense）；无 pyrealsense2 的进程会退化
    # 到 OpenCV UVC 打开 /dev/video8（device 写 8）——两选一。
    video8: {kind: realsense, device: "", width: 640, height: 480, fps: 30}

  # ---------------- model / backend ----------------------------------------------
  model:
    backend_type: "openpi"    # openpi（远程 GPU 主机 serve_policy/serve_act）| act（本机进程内）
    host: "192.168.0.80"      # openpi：模型 server 所在主机（训练/GPU 机）
    port: 8001
    checkpoint_dir: ""        # act：本机 checkpoint 目录（如 astral_ckpt/pickup_act_480/...）
    camera_map: '{"base_0_rgb": "video8", "left_wrist_0_rgb": "video0"}'
    # ⚠️ 必须与模型 preprocessor 输入一致（pickup_act_480 = 480；pi0.5 = 224）
    camera_image_size: 480
    default_prompt: "Pick up the red-capped liquid container and place it into the box"
    engine_mode: "queue_async"   # queue_sync | queue_async | rtc
    action_chunk: 50
    control_interp: 1
    abs_action_min_scale: 0.5

  # ---------------- session --------------------------------------------------------
  session:
    replay_source: ""          # 回放源（aligned h5 或 LeRobot 目录）
    replay_episode: 0
    replay_hold_s: 1.0
    max_joint_vel: 6.0         # rad/s 指令限速；<=0 关闭
    obs_timeout_s: 0.5
    obs_stale_stop_s: 1.0      # 运行中 state 连续缺失超时 → 自动暂停(保持)
    record_dir: ""             # "" = 不记录；否则每次 Session 写 <dir>/session_<ts>.h5
    record_images: true
