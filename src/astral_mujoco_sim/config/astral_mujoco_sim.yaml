astral_mujoco_sim_node:
  ros__parameters:
    mjcf_path: ""
    enable_viewer: true
    realtime: true
    publish_joint_states: true
    state_rate: 50.0
    fps_print_interval: 5.0
    print_latency: true
    latency_print_interval: 2.0
    init_pose_left:  [0.32, 0.11, -0.53, -0.80, 0.28, 0.00, 0.00]
    init_pose_right: [0.32, -0.11, 0.53, -0.80, 0.28, 0.00, 0.00]
    # Gripper (echo only — no MJCF gripper joint). Mirror astral_robot_control.
    enable_gripper_cmd: true
    left_gripper_ns: "left_gripper"
    right_gripper_ns: "right_gripper"
    left_gripper_open_rad: 0.0
    left_gripper_closed_rad: 0.8
    right_gripper_open_rad: 0.0
    right_gripper_closed_rad: 0.8
